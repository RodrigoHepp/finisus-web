@if (visivel()) {
  <div
    class="indicador-processamento"
    [class.indicador-processamento--sobreposto]="modo() === 'sobreposto'"
    [attr.role]="modo() === 'sobreposto' ? 'status' : null"
    [attr.aria-busy]="true"
  >
    <mat-progress-spinner
      mode="indeterminate"
      [diameter]="modo() === 'sobreposto' ? 44 : 18"
      aria-label="Processando"
    />
    <span>{{ mensagem() }}</span>
  </div>
}
