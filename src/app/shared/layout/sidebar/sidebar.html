<aside
  class="sidebar"
  [class.sidebar--recolhida]="recolhida()"
  [attr.aria-label]="'COMPARTILHADO.NAVEGACAO.PRINCIPAL' | translate"
>
  <div class="sidebar-header">
    <a
      class="brand"
      routerLink="/dashboard"
      [attr.aria-label]="'COMPARTILHADO.NAVEGACAO.IR_PARA_VISAO_GERAL' | translate"
    >
      <span class="brand-mark" aria-hidden="true">{{
        'COMPARTILHADO.APLICACAO.INICIAL' | translate
      }}</span>
      <span class="brand-name">{{ 'COMPARTILHADO.APLICACAO.NOME' | translate }}</span>
    </a>

    @if (podeRecolher()) {
      <button
        mat-icon-button
        class="collapse-button"
        type="button"
        [attr.aria-label]="
          recolhida()
            ? ('COMPARTILHADO.NAVEGACAO.EXPANDIR_MENU' | translate)
            : ('COMPARTILHADO.NAVEGACAO.RECOLHER_MENU' | translate)
        "
        [attr.title]="
          recolhida()
            ? ('COMPARTILHADO.NAVEGACAO.EXPANDIR_MENU' | translate)
            : ('COMPARTILHADO.NAVEGACAO.RECOLHER_MENU' | translate)
        "
        (click)="alternarRecolhimento()"
      >
        <mat-icon>{{
          recolhida() ? 'keyboard_double_arrow_right' : 'keyboard_double_arrow_left'
        }}</mat-icon>
      </button>
    }
  </div>

  <nav>
    <mat-nav-list>
      @for (item of itensNavegacao; track item.rota) {
        <a
          mat-list-item
          [routerLink]="item.rota"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
          [attr.aria-label]="recolhida() ? (item.rotulo | translate) : null"
          [attr.title]="recolhida() ? (item.rotulo | translate) : null"
          (click)="selecionarNavegacao()"
        >
          <mat-icon matListItemIcon>{{ item.icone }}</mat-icon>
          <span matListItemTitle class="nav-label">{{ item.rotulo | translate }}</span>
        </a>
      }
    </mat-nav-list>
  </nav>

  <footer class="sidebar-footer">
    <button
      mat-stroked-button
      class="theme-button"
      type="button"
      [attr.aria-label]="
        temaService.tema() === 'escuro'
          ? ('COMPARTILHADO.TEMA.ATIVAR_CLARO' | translate)
          : ('COMPARTILHADO.TEMA.ATIVAR_ESCURO' | translate)
      "
      [attr.title]="
        temaService.tema() === 'escuro'
          ? ('COMPARTILHADO.TEMA.CLARO' | translate)
          : ('COMPARTILHADO.TEMA.ESCURO' | translate)
      "
      (click)="temaService.alternar()"
    >
      <mat-icon>
        {{ temaService.tema() === 'escuro' ? 'light_mode' : 'dark_mode' }}
      </mat-icon>

      <span class="sidebar-button-label">
        {{
          temaService.tema() === 'escuro'
            ? ('COMPARTILHADO.TEMA.CLARO' | translate)
            : ('COMPARTILHADO.TEMA.ESCURO' | translate)
        }}
      </span>
    </button>
    <button
      mat-stroked-button
      class="logout-button"
      type="button"
      [attr.aria-label]="'COMPARTILHADO.NAVEGACAO.SAIR_DA_CONTA' | translate"
      [attr.title]="'COMPARTILHADO.ACOES.SAIR' | translate"
      (click)="sair()"
    >
      <mat-icon>logout</mat-icon>
      <span class="sidebar-button-label">{{ 'COMPARTILHADO.ACOES.SAIR' | translate }}</span>
    </button>
  </footer>
</aside>
