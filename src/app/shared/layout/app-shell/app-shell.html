<mat-sidenav-container class="app-shell" [autosize]="!ehCelular()" [hasBackdrop]="ehCelular()">
  <mat-sidenav
    class="app-sidebar"
    [class.app-sidebar--recolhida]="sidebarEstaRecolhida()"
    [mode]="modoSidebar()"
    [opened]="sidebarAberta()"
    (closedStart)="fecharMenu()"
  >
    <app-sidebar
      [podeRecolher]="!ehCelular()"
      [recolhida]="sidebarEstaRecolhida()"
      (navegacaoSelecionada)="fecharMenu()"
      (recolhimentoAlternado)="alternarRecolhimentoDaSidebar()"
    />
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="mobile-toolbar">
      <button
        mat-icon-button
        type="button"
        [attr.aria-label]="'COMPARTILHADO.NAVEGACAO.ABRIR_MENU' | translate"
        (click)="alternarMenu()"
      >
        <mat-icon class="material-symbols-outlined">menu</mat-icon>
      </button>

      <span>{{ 'COMPARTILHADO.APLICACAO.NOME' | translate }}</span>
    </mat-toolbar>

    <header class="workspace-toolbar">
      <app-breadcrumbs />
    </header>

    <main class="app-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
