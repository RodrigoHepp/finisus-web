<header class="formulario-registro-dialog__cabecalho">
  <div>
    <h2 mat-dialog-title>{{ titulo() }}</h2>
    <p>{{ descricao() }}</p>
  </div>
  <button
    mat-icon-button
    type="button"
    [disabled]="enviando()"
    [attr.aria-label]="'COMPARTILHADO.ACOES.FECHAR' | translate"
    (click)="fechar.emit()"
  >
    <mat-icon class="material-symbols-outlined" aria-hidden="true">close</mat-icon>
  </button>
</header>
